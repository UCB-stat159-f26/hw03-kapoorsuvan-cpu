[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-career"
version = "0.1.0"
description = "Retrieve Tennis Abstract career matches and plot player age differences."
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/UCB-stat159-f26/hw03-kapoorsuvan-cpu"

[tool.setuptools.packages.find]
where = ["src"]
